# Run by hand from the Actions tab. With no version id it only prints the
# deployment history; given one, it rolls production back to that version.
# The two-step shape is deliberate: look first, then point at exactly the
# version you mean, never "whatever came before".
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version ID to roll back to (leave empty to just list the history)"
        required: false
        default: ""

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION_ID: ${{ inputs.version_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: List history, or roll back when given a version
        run: |
          npx wrangler deployments list || true
          npx wrangler versions list || true
          if [ -n "$VERSION_ID" ]; then
            npx wrangler rollback "$VERSION_ID" --message "Rollback via GitHub Actions" --yes
          else
            echo "No version id given - history listed above, nothing changed."
          fi
