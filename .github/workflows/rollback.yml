# Rolls production back to a chosen Cloudflare version. Two ways to drive it:
# the Run workflow button (version id as input), or pushing a change to
# .github/rollback-request ("list" to just print the history, a version id
# to roll back to it). The pushed-file path exists because dispatch-triggered
# runs have sat in GitHub's queue while push-triggered ones start at once.
# Either way: look at the history first, then point at exactly the version
# you mean, never "whatever came before".
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version ID to roll back to (leave empty to just list the history)"
        required: false
        default: ""
  push:
    branches: [master]
    paths: [".github/rollback-request"]

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_VERSION_ID: ${{ inputs.version_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: List history, or roll back when given a version
        run: |
          VERSION_ID="$INPUT_VERSION_ID"
          if [ -z "$VERSION_ID" ] && [ -f .github/rollback-request ]; then
            VERSION_ID=$(grep -v '^#' .github/rollback-request | head -1 | tr -d '[:space:]')
          fi
          if [ "$VERSION_ID" = "list" ]; then
            VERSION_ID=""
          fi
          npx wrangler deployments list || true
          npx wrangler versions list || true
          if [ -n "$VERSION_ID" ]; then
            npx wrangler rollback "$VERSION_ID" --message "Rollback via GitHub Actions" --yes
          else
            echo "No version id given - history listed above, nothing changed."
          fi
