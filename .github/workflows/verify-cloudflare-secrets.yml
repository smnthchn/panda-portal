# Run by hand from the Actions tab (or the API) to prove the two repository
# secrets work against Cloudflare before wiring up a real deploy workflow.
# It never deploys anything: whoami checks the token, the D1 read checks the
# account id and the token's D1 permission.
name: Verify Cloudflare secrets

on: workflow_dispatch

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check both secrets exist
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or not set (check the exact name under Settings > Secrets and variables > Actions)"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or not set (check the exact name under Settings > Secrets and variables > Actions)"
            missing=1
          fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: API token authenticates
        run: npx wrangler whoami

      # d1 execute rather than migrations list: migrations list can throw a
      # spurious 7403 (see CLAUDE.md), and a plain read can't.
      - name: Token + account id can read the production D1
        run: npx wrangler d1 execute panda_portal_db --remote --json --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 3"
